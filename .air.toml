# air.toml
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  
  # CRITICAL SETTINGS BELOW:
  # This sends a SIGINT (Interrupt) instead of a hard kill
  send_interrupt = true
  # This gives your app 500ms to run app.Shutdown()
  kill_delay = "500ms"
  # This ensures the process is stopped before the new one starts
  stop_on_error = true

[log]
  main_only = false
  silent = false